<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c292a" />
    <title>The City Around You — Karachi Civic Intelligence</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">K</div><div><strong>The City</strong><span>Around You</span></div></div>
        <div class="demo-chip"><span class="pulse"></span> Demo environment</div>
        <nav id="nav"></nav>
        <div class="sidebar-bottom">
          <div class="privacy-note"><span><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.8 20 6v6c0 5-3.4 8-8 9.2C7.4 20 4 17 4 12V6l8-3.2Z"/><path d="m9 12 2 2 4-4"/></svg></span><div><strong>Built for trust</strong><small>AI recommends. People decide.</small></div></div>
          <div class="user-mini">
            <div class="avatar" id="user-initials">AK</div>
            <div><strong id="user-name">—</strong><small id="user-role">—</small></div>
            <button class="signout-btn" id="signout" title="Sign out" aria-label="Sign out"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3.5v8"/><path d="M7 6.4a8 8 0 1 0 10 0"/></svg></button>
          </div>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="breadcrumb"><span id="crumb-section">Overview</span><span>/</span><strong id="crumb-title">Overview</strong></div>
          <div class="top-actions">
            <div class="account-chip"><span class="role-dot"></span><span id="account-label">—</span></div>
          </div>
        </header>
        <div id="content"></div>
      </main>
    </div>

    <div id="toast" class="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
